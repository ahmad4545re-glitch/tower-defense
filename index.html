<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tower Defense Pro</title>
    <style>
        body {
            margin: 0;
            background: #1a1a2e;
            font-family: Arial, sans-serif;
            text-align: center;
            color: white;
            user-select: none;
        }
        h1 {
            margin: 5px 0;
            font-size: 20px;
            color: #e94560;
        }
        #ui {
            background: #16213e;
            padding: 5px;
            display: flex;
            justify-content: center;
            gap: 10px;
            font-size: 13px;
            border-bottom: 2px solid #0f3460;
        }
        canvas {
            background: #0f3460;
            display: block;
            margin: 8px auto;
            border: 2px solid #e94560;
        }
        .controls-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 5px;
        }
        button {
            background: #e94560;
            color: white;
            border: none;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #ff6b6b;
        }
        .tower-btn.selected {
            background: #00adb5;
            border: 2px solid white;
        }
    </style>
</head>
<body>

    <h1>Tower Defense Pro</h1>
    <div id="ui">
        <div>Lives: <span id="lives">20</span></div>
        <div>Gold: <span id="gold">0</span></div>
        <div>Wave: <span id="wave">0</span></div>
        <div>Score: <span id="score">0</span></div>
    </div>

    <canvas id="gameCanvas" width="360" height="360"></canvas>

    <div class="controls-container">
        <button id="archerBtn" class="tower-btn" onclick="selectTower('archer')">Archer (50G)</button>
        <button id="cannonBtn" class="tower-btn" onclick="selectTower('cannon')">Cannon (100G)</button>
    </div>
    <div>
        <button id="waveBtn" onclick="startNextWave()">Start Wave</button>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let lives = 20;
let gold = 0;
let wave = 0;
let score = 0;
let selectedTowerType = null;

const path = [
    {x: 0, y: 40},
    {x: 100, y: 40},
    {x: 100, y: 200},
    {x: 260, y: 200},
    {x: 260, y: 320},
    {x: 360, y: 320}
];

let towers = [];
let enemies = [];
let projectiles = [];
let waveInProgress = false;

const towerTypes = {
    archer: { cost: 50, range: 70, damage: 20, coolDown: 35, color: '#00adb5' },
    cannon: { cost: 100, range: 50, damage: 50, coolDown: 70, color: '#ff5722' }
};

function selectTower(type) {
    selectedTowerType = type;
    document.querySelectorAll('.tower-btn').forEach(b => b.classList.remove('selected'));
    if(type === 'archer') document.getElementById('archerBtn').classList.add('selected');
    if(type === 'cannon') document.getElementById('cannonBtn').classList.add('selected');
}

canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    if (!selectedTowerType) {
        alert("Please select a tower first!");
        return;
    }

    let cost = towerTypes[selectedTowerType].cost;
    if (gold >= cost) {
        towers.push({
            x: x,
            y: y,
            type: selectedTowerType,
            range: towerTypes[selectedTowerType].range,
            damage: towerTypes[selectedTowerType].damage,
            coolDown: towerTypes[selectedTowerType].coolDown,
            timer: 0
        });
        gold -= cost;
        updateUI();
    } else {
        alert("Not enough gold! Defeat enemies to earn gold.");
    }
});

function startNextWave() {
    if (waveInProgress) return;
    wave++;
    waveInProgress = true;
    document.getElementById('waveBtn').disabled = true;

    let enemyCount = 4 + wave * 2;
    let spawned = 0;

    let interval = setInterval(() => {
        if (spawned < enemyCount) {
            enemies.push({
                x: path[0].x,
                y: path[0].y,
                pathIndex: 0,
                hp: 80 + wave * 25,
                maxHp: 80 + wave * 25,
                speed: 1.0 + wave * 0.05
            });
            spawned++;
        } else {
            clearInterval(interval);
        }
    }, 1200);
}

function updateUI() {
    document.getElementById('lives').innerText = lives;
    document.getElementById('gold').innerText = gold;
    document.getElementById('wave').innerText = wave;
    document.getElementById('score').innerText = score;
}

function update() {
    for (let i = enemies.length - 1; i >= 0; i--) {
        let enemy = enemies[i];
        let target = path[enemy.pathIndex + 1];
        if (!target) {
            lives--;
            enemies.splice(i, 1);
            updateUI();
            if (lives <= 0) {
                alert('Game Over!');
                location.reload();
            }
            continue;
        }

        let dx = target.x - enemy.x;
        let dy = target.y - enemy.y;
        let dist = Math.hypot(dx, dy);

        if (dist < enemy.speed) {
            enemy.pathIndex++;
        } else {
            enemy.x += (dx / dist) * enemy.speed;
            enemy.y += (dy / dist) * enemy.speed;
        }
    }

    towers.forEach(tower => {
        if (tower.timer > 0) tower.timer--;

        if (tower.timer === 0) {
            let target = null;
            let minDist = Infinity;

            enemies.forEach(enemy => {
                let d = Math.hypot(enemy.x - tower.x, enemy.y - tower.y);
                if (d < tower.range && d < minDist) {
                    minDist = d;
                    target = enemy;
                }
            });

            if (target) {
                projectiles.push({
                    x: tower.x,
                    y: tower.y,
                    target: target,
                    damage: tower.damage,
                    speed: 4
                });
                tower.timer = tower.coolDown;
            }
        }
    });

    for (let i = projectiles.length - 1; i >= 0; i--) {
        let p = projectiles[i];
        if (!enemies.includes(p.target)) {
            projectiles.splice(i, 1);
            continue;
        }

        let dx = p.target.x - p.x;
        let dy = p.target.y - p.y;
        let dist = Math.hypot(dx, dy);

        if (dist < p.speed) {
            p.target.hp -= p.damage;
            if (p.target.hp <= 0) {
                let index = enemies.indexOf(p.target);
                if (index > -1) {
                    enemies.splice(index, 1);
                    gold += 25;
                    score += 40;
                    updateUI();
                }
            }
            projectiles.splice(i, 1);
        } else {
            p.x += (dx / dist) * p.speed;
            p.y += (dy / dist) * p.speed;
        }
    }

    if (waveInProgress && enemies.length === 0 && document.getElementById('waveBtn').disabled) {
        // Check if all enemies of the wave have spawned and died
        let enemyCount = 4 + wave * 2;
        // Simple heuristic: if interval finished and enemies array is empty
        waveInProgress = false;
        document.getElementById('waveBtn').disabled = false;
        gold += 80;
        score += 150;
        updateUI();
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw path
    ctx.strokeStyle = '#393e46';
    ctx.lineWidth = 22;
    ctx.beginPath();
    ctx.moveTo(path[0].x, path[0].y);
    for (let i = 1; i < path.length; i++) {
        ctx.lineTo(path[i].x, path[i].y);
    }
    ctx.stroke();

    // Draw towers
    towers.forEach(tower => {
        ctx.fillStyle = towerTypes[tower.type].color;
        ctx.beginPath();
        ctx.arc(tower.x, tower.y, 11, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = 'white';
        ctx.stroke();
    });

    // Draw enemies
    enemies.forEach(enemy => {
        ctx.fillStyle = '#ff2e63';
        ctx.beginPath();
        ctx.arc(enemy.x, enemy.y, 7, 0, Math.PI * 2);
        ctx.fill();

        // HP bar
        ctx.fillStyle = 'red';
        ctx.fillRect(enemy.x - 10, enemy.y - 14, 20, 3);
        ctx.fillStyle = 'green';
        ctx.fillRect(enemy.x - 10, enemy.y - 14, (enemy.hp / enemy.maxHp) * 20, 3);
    });

    // Draw projectiles
    projectiles.forEach(p => {
        ctx.fillStyle = '#ffff00';
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fill();
    });
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
