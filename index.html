<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Tower Defense Game</title>
    <style>
        body {
            margin: 0;
            background: #1a1a2e;
            font-family: Arial, sans-serif;
            text-align: center;
            color: white;
            user-select: none;
        }
        h1 {
            margin: 5px 0;
            font-size: 22px;
            color: #e94560;
        }
        #ui {
            background: #16213e;
            padding: 8px;
            display: flex;
            justify-content: center;
            gap: 15px;
            font-size: 14px;
            border-bottom: 2px solid #0f3460;
        }
        canvas {
            background: #0f3460;
            display: block;
            margin: 10px auto;
            border: 3px solid #e94560;
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
        }
        #controls {
            margin-top: 5px;
        }
        button {
            background: #e94560;
            color: white;
            border: none;
            padding: 8px 15px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin: 3px;
        }
        button:hover {
            background: #ff6b6b;
        }
        .tower-btn {
            background: #0f3460;
            border: 2px solid #e94560;
        }
        .tower-btn.selected {
            background: #e94560;
        }
    </style>
</head>
<body>

    <h1>Tower Defense Pro</h1>
    <div id="ui">
        <div>Lives: <span id="lives">20</span></div>
        <div>Gold: <span id="gold">0</span></div>
        <div>Wave: <span id="wave">0</span></div>
        <div>Score: <span id="score">0</span></div>
    </div>

    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <div id="controls">
        <div>
            <button class="tower-btn" onclick="selectTower('archer')">Archer (Cost: 50)</button>
            <button class="tower-btn" onclick="selectTower('cannon')">Cannon (Cost: 100)</button>
        </div>
        <button id="waveBtn" onclick="startNextWave()">Start Wave</button>
    </div>

    document.querySelectorAll('.tower-btn').forEach(b => b.classList.remove('selected'));
